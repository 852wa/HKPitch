HKPitch.Name="HKPitch（声のピッチ・フォルマント）"
HKPitch.Pakitto="ぱきっと（中域をカットしてから処理）"
HKPitch.Pakitto.Help="3バンドイコライザ（OBS標準と同じ分け方）で、中域（800Hz〜5kHz）を一番下まで下げてから声を変えます（OBS標準の最小 −20dB よりさらに深く。帯域の境目はゆるやかです）。低い響きと高いシャリ感だけが残る、輪郭のはっきりした音になります。"
HKPitch.Hakkiri="はっきり（中域を少し下げてから処理）"
HKPitch.Hakkiri.Help="3バンドイコライザで、中域（800Hz〜5kHz）を -10dB 下げてから声を変えます。ぱきっとより自然で、輪郭はほどほどにはっきりします。ぱきっととは同時に使えません（片方をオンにすると、もう片方は切れます）。"
HKPitch.Preset="プリセット（選ぶと下の値が入ります）"
HKPitch.Preset.Custom="手動で調整"
HKPitch.Preset.Polite="よそいき（ピッチ +1 / フォルマント +0.5）"
HKPitch.Preset.Child="子ども（ピッチ +4 / フォルマント +2）"
HKPitch.Preset.Girl="女の子（ピッチ +2 / フォルマント +1）"
HKPitch.Preset.Boy="男の子（ピッチ -2 / フォルマント -1）"
HKPitch.Preset.Man="男性（ピッチ -4 / フォルマント -2）"
HKPitch.Preset.DeepMan="低い男性（ピッチ -8 / フォルマント -4）"
HKPitch.Preset.Reset="元に戻す（0 / 0）"
HKPitch.Pitch="ピッチ（声の高さ）"
HKPitch.Pitch.Help="声の高さを半音単位で変えます。12 で 1 オクターブ上。フォルマントが 0 なら、声の響き（声質）は元のまま高さだけが変わります。"
HKPitch.Formant="フォルマント（声の響き・声質）"
HKPitch.Formant.Help="高さを変えずに声の響きだけを動かします。プラスで小柄・若い感じ、マイナスで大柄・太い感じ。ピッチと同じ値にすると、テープの早回しのような声になります。"
HKPitch.Semitones=" 半音"
HKPitch.Quality="処理モード"
HKPitch.Quality.High="高品質（おすすめ・遅延 約32ms）"
HKPitch.Quality.Balanced="バランス（遅延 約24ms）"
HKPitch.Quality.Low="低遅延（遅延 約20ms・ときどき 1 周期ぶん音が飛ぶことがある）"
HKPitch.Quality.Help="声の1周期ごとに切り貼りする方式です。遅延を短くするほど、低い声や声の出だしの扱いが少し苦しくなります。ふだんは高品質、映像とのずれを減らしたいときはバランスがおすすめです。ひとりの声専用なので、BGMや楽器が混ざった音には向きません。"
HKPitch.Mix="加工した声の割合"
HKPitch.Gain="出力の音量"
HKPitch.Info="この処理で音声が少し遅れます（高品質 約32ms / バランス 約24ms / 低遅延 約20ms）。自分の声をヘッドホンで聞きながら話すと、生の声と遅れた声が重なって二重に聞こえることがあります。確認は録画して聞き直すのがおすすめです。映像とのずれは「音声の詳細プロパティ」の同期オフセットで直せます。"
