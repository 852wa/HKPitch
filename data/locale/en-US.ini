HKPitch.Name="HKPitch (voice pitch & formant)"
HKPitch.Pakitto="Pakitto (cut the mids before processing)"
HKPitch.Pakitto.Help="Turns the mid band (800 Hz to 5 kHz) all the way down with a 3-band equalizer (same bands as the OBS built-in one, deeper than its -20 dB minimum; the band edges are gentle) before shifting the voice, leaving only the low body and the high crispness."
HKPitch.Preset="Preset (fills in the values below)"
HKPitch.Preset.Custom="Manual"
HKPitch.Preset.Polite="Polished (pitch +1 / formant +0.5)"
HKPitch.Preset.Child="Child (pitch +4 / formant +2)"
HKPitch.Preset.Girl="Girl (pitch +2 / formant +1)"
HKPitch.Preset.Boy="Boy (pitch -2 / formant -1)"
HKPitch.Preset.Man="Man (pitch -4 / formant -2)"
HKPitch.Preset.DeepMan="Deep man (pitch -8 / formant -4)"
HKPitch.Preset.Reset="Reset (0 / 0)"
HKPitch.Pitch="Pitch"
HKPitch.Pitch.Help="Shifts the voice in semitones (12 = one octave). With formant at 0, the voice character is preserved and only the pitch changes."
HKPitch.Formant="Formant (voice character)"
HKPitch.Formant.Help="Moves the vocal resonances without changing pitch. Positive sounds smaller/younger, negative sounds bigger/deeper. Setting it equal to pitch gives a sped-up-tape sound."
HKPitch.Semitones=" st"
HKPitch.Quality="Mode"
HKPitch.Quality.High="High quality (recommended, ~32 ms latency)"
HKPitch.Quality.Balanced="Balanced (~24 ms latency)"
HKPitch.Quality.Low="Low latency (~20 ms latency, may occasionally skip one period)"
HKPitch.Quality.Help="Works period by period on the voice. Shorter latency makes low voices and voice onsets slightly harder to handle. Use High quality normally, or Balanced to reduce lip-sync offset. For a single voice only; not suited to music or mixed sources."
HKPitch.Mix="Wet mix"
HKPitch.Gain="Output gain"
HKPitch.Info="This filter delays audio slightly (High quality ~32 ms / Balanced ~24 ms / Low latency ~20 ms). Monitoring yourself on headphones while speaking can sound doubled, because you hear your live voice and the delayed one together; record and play back to judge quality. Fix lip sync with Sync Offset in Advanced Audio Properties."
